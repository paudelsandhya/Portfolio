<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Primary Meta Tags -->
    <title>404 - Page Not Found | Sandhya Poudel</title>
    <meta name="title" content="404 - Page Not Found | Sandhya Poudel" />
    <meta name="description"
        content="The page you're looking for doesn't exist. Return to Sandhya Poudel's portfolio." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://www.paudel-sandhya.com.np/404.html" />

    <!-- Favicon -->
    <link rel="icon" href="./assets/Sandhya-Paudel_Profile-Picture.jpg" type="image/jpeg" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            position: relative;
            z-index: 2;
        }

        .error-code {
            font-size: clamp(80px, 20vw, 180px);
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            line-height: 1;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(102, 126, 234, 0.5),
                    0 0 30px rgba(102, 126, 234, 0.3);
                filter: brightness(1);
            }

            to {
                text-shadow: 0 0 30px rgba(118, 75, 162, 0.8),
                    0 0 50px rgba(118, 75, 162, 0.4);
                filter: brightness(1.2);
            }
        }

        h1 {
            font-size: clamp(24px, 5vw, 42px);
            margin-bottom: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        p {
            font-size: clamp(16px, 3vw, 18px);
            color: #b0b0b0;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-home:hover::before {
            left: 100%;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .btn-home:active {
            transform: translateY(-1px);
        }

        /* Animated background particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
            opacity: 0.1;
        }

        .particle:nth-child(1) {
            width: 80px;
            height: 80px;
            background: #667eea;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 8s;
        }

        .particle:nth-child(2) {
            width: 60px;
            height: 60px;
            background: #764ba2;
            top: 60%;
            right: 15%;
            animation-delay: 1s;
            animation-duration: 10s;
        }

        .particle:nth-child(3) {
            width: 100px;
            height: 100px;
            background: #667eea;
            bottom: 10%;
            left: 20%;
            animation-delay: 2s;
            animation-duration: 12s;
        }

        .particle:nth-child(4) {
            width: 70px;
            height: 70px;
            background: #764ba2;
            top: 30%;
            right: 25%;
            animation-delay: 1.5s;
            animation-duration: 9s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
            }

            25% {
                transform: translateY(-30px) translateX(20px);
            }

            50% {
                transform: translateY(-60px) translateX(-20px);
            }

            75% {
                transform: translateY(-30px) translateX(20px);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .error-code {
                margin-bottom: 10px;
            }

            h1 {
                margin-bottom: 12px;
            }

            p {
                margin-bottom: 24px;
            }
        }
    </style>
</head>

<body>
    <!-- Animated background particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="container">
        <div class="error-code">404</div>
        <h1>Oops! Page Not Found</h1>
        <p>The page you're looking for seems to have wandered off. Let's get you back to familiar territory.</p>
        <a href="/" class="btn-home">← Back to Home</a>
    </div>
</body>

</html>
